name: Build Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            qt_arch: win64_msvc2017_64
            artifact_name: rclone-browser-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Qt 5.13.2
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall
          aqt install-qt windows desktop 5.13.2 ${{ matrix.qt_arch }} -O C:\Qt

      - name: Install packaging dependencies
        shell: powershell
        run: |
          choco install cmake git 7zip innosetup -y --no-progress

      - name: Build Windows package
        shell: cmd
        run: |
          scripts\release_windows.cmd ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release\*.zip
            release\*.exe
          if-no-files-found: error

  build-linux:
    name: Linux AppImage x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libfuse2 \
            qtbase5-dev \
            qttools5-dev \
            qttools5-dev-tools

      - name: Install linuxdeploy tools
        run: |
          mkdir -p "$HOME/bin"
          curl -L -o "$HOME/bin/linuxdeploy" \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o "$HOME/bin/linuxdeploy-plugin-qt" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          curl -L -o "$HOME/bin/linuxdeploy-plugin-appimage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x "$HOME/bin/linuxdeploy" \
            "$HOME/bin/linuxdeploy-plugin-qt" \
            "$HOME/bin/linuxdeploy-plugin-appimage"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build Linux AppImage
        run: |
          scripts/release_AppImage.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rclone-browser-linux-x86_64
          path: release/*.AppImage
          if-no-files-found: error
